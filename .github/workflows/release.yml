name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      sign-tag:
        description: Existing tag to sign without building
        required: true
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: release / conformance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/compiler/depcruise/testdata/tool/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            internal/compiler/semgrep/testdata/tool/requirements.txt
            internal/compiler/importlinter/testdata/tool/requirements.txt
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependency-cruiser
        working-directory: internal/compiler/depcruise/testdata/tool
        run: npm ci --ignore-scripts
      - name: Install Semgrep
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/semgrep"
          "${RUNNER_TEMP}/semgrep/bin/pip" install --require-hashes --no-deps -r internal/compiler/semgrep/testdata/tool/requirements.txt
          echo "${RUNNER_TEMP}/semgrep/bin" >> "$GITHUB_PATH"
      - name: Install ArchUnit
        run: bash internal/compiler/archunit/testdata/tool/install.sh
      - name: Install import-linter
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/importlinter"
          "${RUNNER_TEMP}/importlinter/bin/pip" install --require-hashes --no-deps -r internal/compiler/importlinter/testdata/tool/requirements.txt
          echo "${RUNNER_TEMP}/importlinter/bin" >> "$GITHUB_PATH"
      - name: Run the conformance suite
        run: go test -tags conformance ./internal/compiler/conformance -count=1

  release:
    needs: conformance
    if: always() && (needs.conformance.result == 'success' || needs.conformance.result == 'skipped')
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ergoprobat/.github/.github/workflows/release-cli.yml@c982f324efb4fabedc7f44acb7ef452cfa204bfe
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sign-tag || github.ref }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.sign-tag || github.ref_name }}
      sign-only: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
