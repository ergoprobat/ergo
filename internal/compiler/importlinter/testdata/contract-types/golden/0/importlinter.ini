[importlinter]
root_packages =
    shop

[importlinter:contract:forbidden]
allow_indirect_imports = False
as_packages = True
forbidden_modules =
    shop.infra
ignore_imports =
    shop.api -> shop.infra
name = Forbidden
source_modules =
    shop.api
type = forbidden

[importlinter:contract:layers]
containers =
    shop
exhaustive = True
exhaustive_ignores =
    shop.util
layers =
    shop.api | shop.web
    (shop.domain)
name = Layers
type = layers

[importlinter:contract:independence]
modules =
    shop.billing
    shop.shipping
name = Independence
type = independence

[importlinter:contract:protected]
allowed_importers =
    shop.api
name = Protected
protected_modules =
    shop.domain
type = protected

[importlinter:contract:siblings]
ancestors =
    shop
depth = 1
name = Siblings
skip_descendants =
    shop.tests
type = acyclic_siblings
