[importlinter]
root_packages =
    shop

[importlinter:contract:layers]
layers =
    shop.api
    shop.domain
name = Layers
type = layers

[importlinter:contract:independence]
modules =
    shop.billing
    shop.shipping
name = Independence
type = independence

[importlinter:contract:forbidden]
forbidden_modules =
    shop.infra
name = Forbidden
source_modules =
    shop.domain
type = forbidden
