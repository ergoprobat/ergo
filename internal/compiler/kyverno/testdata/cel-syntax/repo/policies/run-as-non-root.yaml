apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: run-as-non-root
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  validations:
    - expression: object.spec.
      message: runAsNonRoot must be true
