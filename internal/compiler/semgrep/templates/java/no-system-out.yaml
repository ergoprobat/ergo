rules:
  - id: java.no-system-out
    message: Logging must not use System.out
    languages:
      - java
    metadata:
      title: Java logging does not use System.out
    pattern-either:
      - pattern: System.out.print(...)
      - pattern: System.out.println(...)
      - pattern: System.err.print(...)
      - pattern: System.err.println(...)
