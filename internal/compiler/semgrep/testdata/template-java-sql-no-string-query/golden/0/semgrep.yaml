rules:
  - id: java.sql-no-string-query
    languages:
      - java
    message: SQL queries must use placeholders
    metadata:
      title: Java SQL queries use placeholders
    patterns:
      - pattern-either:
          - pattern: $S.executeQuery($Q)
          - pattern: $S.executeUpdate($Q)
          - pattern: $S.execute($Q)
          - pattern: $C.prepareStatement($Q)
      - pattern-not: $S.executeQuery("...")
      - pattern-not: $S.executeUpdate("...")
      - pattern-not: $S.execute("...")
      - pattern-not: $C.prepareStatement("...")
    severity: ERROR
